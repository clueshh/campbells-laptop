[a11y/keyboard]
enable=false

[app-folders]
folder-children=['Utilities', 'YaST', 'Pardus']

[app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[app-folders/folders/Utilities]
apps=['gnome-abrt.desktop', 'gnome-system-log.desktop', 'nm-connection-editor.desktop', 'org.gnome.baobab.desktop', 'org.gnome.Connections.desktop', 'org.gnome.DejaDup.desktop', 'org.gnome.Dictionary.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.Evince.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.fonts.desktop', 'org.gnome.Loupe.desktop', 'org.gnome.seahorse.Application.desktop', 'org.gnome.tweaks.desktop', 'org.gnome.Usage.desktop', 'vinagre.desktop']
categories=['X-GNOME-Utilities']
name='X-GNOME-Utilities.directory'
translate=true

[app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[applications/terminal]
exec='/usr/bin/konsole'
exec-arg='-e'

[background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/campbell/.local/share/backgrounds/2025-11-06-22-27-50-aishot-1533.jpg'
picture-uri-dark='file:///home/campbell/.local/share/backgrounds/2025-11-06-22-27-50-aishot-1533.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[calendar]
show-weekdate=false

[datetime]
automatic-timezone=true

[input-sources]
sources=[('xkb', 'us')]
xkb-options=@as []

[interface]
clock-format='12h'
clock-show-seconds=false
clock-show-weekday=true
color-scheme='prefer-dark'
gtk-theme='Yaru-bark-dark'
icon-theme='Yaru-bark'
show-battery-percentage=false
toolkit-accessibility=false

[notifications]
application-children=['google-chrome', 'slack-slack', 'code', 'org-gnome-terminal', 'org-gnome-characters', 'gnome-power-panel', 'apport-gtk', 'firefox-firefox', 'dbeaver-ce-dbeaver-ce', 'org-gnome-extensions', 'spotify', 'org-gnome-nautilus', 'org-kde-konsole', '1password', 'org-gnome-baobab', 'obsidian-obsidian', 'dbeaver-ce', 'snapd-desktop-integration-snapd-desktop-integration', 'slack', 'mqttx', 'upnote', 'hermes']

[notifications/application/1password]
application-id='1password.desktop'

[notifications/application/apport-gtk]
application-id='apport-gtk.desktop'

[notifications/application/code]
application-id='code.desktop'

[notifications/application/dbeaver-ce-dbeaver-ce]
application-id='dbeaver-ce_dbeaver-ce.desktop'

[notifications/application/dbeaver-ce]
application-id='dbeaver-ce.desktop'

[notifications/application/firefox-firefox]
application-id='firefox_firefox.desktop'

[notifications/application/gnome-power-panel]
application-id='gnome-power-panel.desktop'

[notifications/application/google-chrome]
application-id='google-chrome.desktop'

[notifications/application/hermes]
application-id='hermes.desktop'

[notifications/application/mqttx]
application-id='mqttx.desktop'

[notifications/application/obsidian-obsidian]
application-id='obsidian_obsidian.desktop'

[notifications/application/org-gnome-baobab]
application-id='org.gnome.baobab.desktop'

[notifications/application/org-gnome-characters]
application-id='org.gnome.Characters.desktop'

[notifications/application/org-gnome-extensions]
application-id='org.gnome.Extensions.desktop'

[notifications/application/org-gnome-nautilus]
application-id='org.gnome.Nautilus.desktop'

[notifications/application/org-gnome-terminal]
application-id='org.gnome.Terminal.desktop'

[notifications/application/org-kde-konsole]
application-id='org.kde.konsole.desktop'

[notifications/application/slack-slack]
application-id='slack_slack.desktop'

[notifications/application/slack]
application-id='slack.desktop'

[notifications/application/snapd-desktop-integration-snapd-desktop-integration]
application-id='snapd-desktop-integration_snapd-desktop-integration.desktop'

[notifications/application/spotify]
application-id='spotify.desktop'

[notifications/application/upnote]
application-id='upnote.desktop'

[peripherals/keyboard]
numlock-state=false

[peripherals/mouse]
accel-profile='flat'
speed=0.4339622641509433

[peripherals/touchpad]
two-finger-scrolling-enabled=true

[privacy]
old-files-age=uint32 30
recent-files-max-age=-1

[screensaver]
color-shading-type='solid'
lock-delay=uint32 0
lock-enabled=true
picture-options='zoom'
picture-uri='file:///home/campbell/.local/share/backgrounds/2025-11-06-22-27-50-aishot-1533.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[search-providers]
sort-order=['org.gnome.Contacts.desktop', 'org.gnome.Documents.desktop', 'org.gnome.Nautilus.desktop']

[session]
idle-delay=uint32 300

[sound]
event-sounds=false
