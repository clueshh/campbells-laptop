[plugins/color]
night-light-enabled=false
night-light-schedule-automatic=false
night-light-schedule-from=0.0
night-light-schedule-to=23.983333333333334
night-light-temperature=uint32 3202

[plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/wezterm/']
terminal=@as []

[plugins/media-keys/custom-keybindings/wezterm]
binding='<Primary><Alt>t'
command='wezterm'
name='WezTerm'

[plugins/power]
idle-dim=false
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='nothing'
