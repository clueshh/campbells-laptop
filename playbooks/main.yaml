---
- name: Install local laptop requirements
  hosts: localhost
  tags: [install]
  tasks:
    - name: Always gather facts (incase run with tags)
      ansible.builtin.setup:
      tags: always

    - name: Add apt keys
      tags: apt-repo-key
      ansible.builtin.apt_key:
        url: "{{ item.url }}"
        keyring: "{{ item.keyring }}"
        state: present
      become: true
      loop: "{{ apt_keys }}"

    - name: Add apt repos
      tags: apt-repo
      ansible.builtin.apt_repository:
        repo: "{{ item }}"
        state: present
      become: true
      loop: "{{ apt_repos }}"
      when: item is string

    - name: Add apt repos (with filename)
      tags: apt-repo
      ansible.builtin.apt_repository:
        repo: "{{ item.repo }}"
        filename: "{{ item.filename }}"
        state: present
      become: true
      loop: "{{ apt_repos }}"
      when: item is mapping

    - name: Preseed to prevent Microsoft repo being added
      # https://code.visualstudio.com/docs/setup/linux#_debian-and-ubuntu-based-distributions
      ansible.builtin.debconf:
        name: code
        question: "code/add-microsoft-repo"
        value: "false"
        vtype: boolean
      become: true

    - name: Ensure repo_reenable_on_distupgrade is set to false in google-chrome defaults
      # https://stackoverflow.com/a/35850155
      ansible.builtin.lineinfile:
        path: /etc/default/google-chrome
        regexp: "^repo_reenable_on_distupgrade="
        line: 'repo_reenable_on_distupgrade="false"'
        create: true
        backrefs: false
        mode: "0644"
      become: true

    - name: Apt install software
      tags: [software-install, apt]
      ansible.builtin.apt:
        state: present
        name: "{{ item }}"
      become: true
      loop: "{{ apt_install }}"

    - name: Apt install k9s
      tags: [software-install, apt, k9s]
      ansible.builtin.apt:
        state: present
        deb: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_linux_amd64.deb"
      become: true

    - name: Install session-manager-plugin
      tags: [software-install, session-manager-plugin]
      ansible.builtin.apt:
        state: present
        deb: "{{ session_manager_plugin_deb }}"
      become: true

    - name: Install keybase
      tags: [software-install, keybase]
      ansible.builtin.apt:
        state: present
        deb: "{{ keybase_deb }}"
      become: true

    - name: Install mongodb-compass
      tags: [software-install, mongodb-compass]
      ansible.builtin.apt:
        state: present
        deb: "https://downloads.mongodb.com/compass/mongodb-compass_{{ mongodb_compass_version }}_amd64.deb"
      become: true

    - name: Snap install software
      tags: [software-install, snap]
      community.general.snap:
        state: present
        name: "{{ item }}"
        classic: "{{ item in snap_classic }}"
      become: true
      loop: "{{ snap_install }}"

    - name: Find all .desktop files in snap installed apps
      tags: [software-install, snap]
      ansible.builtin.find:
        recurse: false
        paths: /var/lib/snapd/desktop/applications/
        patterns: "*.desktop"
      register: find

    - name: Link snap installed apps to /usr/share/applications
      tags: [software-install, snap]
      ansible.builtin.file:
        src: "{{ item.path }}"
        path: "/usr/share/applications/{{ item.path | basename }}"
        state: link
      become: true
      loop: "{{ find.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Check if aws binary is in PATH
      tags: [software-install, awscli]
      ansible.builtin.command: which aws
      changed_when: aws_path.rc != 0
      register: aws_path
      ignore_errors: true
      no_log: true

    - name: Install aws cli
      tags: [software-install, awscli]
      ansible.builtin.import_role:
        name: deekayen.awscli2
      when: aws_path.rc != 0

    - name: Install oh-my-zsh
      tags: [zsh, ohmyzsh]
      ansible.builtin.import_role:
        name: manala.roles.ohmyzsh
      become: true

    - name: Install zsh plugins
      tags: [zsh, zsh-plugins]
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        version: "{{ item.version | default('HEAD') }}"
      become: true
      loop: "{{ zsh_plugins }}"
      loop_control:
        label: "{{ item.repo }}"

    - name: Install Atuin
      tags: [zsh, atuin]
      ansible.builtin.unarchive:
        src: https://github.com/atuinsh/atuin/releases/download/{{ atuin_version }}/atuin-x86_64-unknown-linux-gnu.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
        include: [atuin-x86_64-unknown-linux-gnu/atuin]
        extra_opts: ["--strip-components=1", "--show-stored-names"]
      become: true

    - name: Install single-binary release tools
      tags: [software-install, release-binaries]
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/usr/local/bin/{{ item.name }}"
        mode: "0755"
      become: true
      loop: "{{ release_binaries | selectattr('archive', 'equalto', 'none') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install archived release tools
      tags: [software-install, release-binaries]
      ansible.builtin.unarchive:
        src: "{{ item.url }}"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
        include: ["{{ item.include }}"]
      become: true
      loop: "{{ release_binaries | selectattr('archive', 'in', ['tar', 'zip']) | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install gifski
      tags: [software-install, gifski]
      ansible.builtin.unarchive:
        src: "https://github.com/ImageOptim/gifski/releases/download/{{ gifski_version }}/gifski-{{ gifski_version }}.tar.xz"
        dest: "{{ ansible_env.HOME }}/.local/bin"
        remote_src: true
        mode: "0755"
        include: [linux/gifski]
        extra_opts: ["--strip-components=1"]

    - name: Install rustup and the stable toolchain # noqa: command-instead-of-module
      tags: [software-install, rustup]
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
          | sh -s -- -y --no-modify-path
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.cargo/bin/rustup"

    - name: Install uv # noqa: command-instead-of-module
      tags: [software-install, uv]
      ansible.builtin.shell:
        cmd: set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.local/bin/uv"
      environment:
        UV_NO_MODIFY_PATH: "1"

    - name: Install GitHub Copilot CLI
      tags: [software-install, copilot]
      community.general.npm:
        name: "@github/copilot"
        global: true
        state: present

    - name: Install krew # noqa: command-instead-of-module
      tags: [software-install, krew]
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          tmp="$(mktemp -d)" && cd "$tmp" &&
          curl -fsSLo krew.tar.gz
          "https://github.com/kubernetes-sigs/krew/releases/download/{{ krew_version }}/krew-linux_amd64.tar.gz" &&
          tar zxvf krew.tar.gz && ./krew-linux_amd64 install krew &&
          rm -rf "$tmp"
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.krew/bin/kubectl-krew"
      environment:
        KREW_ROOT: "{{ ansible_env.HOME }}/.krew"

    - name: Install starship
      tags: [zsh, starship]
      ansible.builtin.import_role:
        name: rolehippie.starship
      become: true

    - name: Install nvm
      tags: nvm
      ansible.builtin.import_role:
        name: nvm

    - name: Install pyenv
      tags: pyenv
      ansible.builtin.import_role:
        name: staticdev.pyenv

    - name: Install golang
      tags: golang
      ansible.builtin.import_role:
        name: gantsign.golang

    - name: Ensure fonts directory exists
      tags: fonts
      ansible.builtin.file:
        path: "{{ fonts_path | default('/usr/share/fonts/TTF') }}"
        state: directory
        mode: "0755"
      become: true

    - name: Install Consolas ligaturized fonts for vscode
      tags: fonts
      ansible.builtin.copy:
        src: "files/fonts/{{ item }}"
        dest: "{{ fonts_path | default('/usr/share/fonts/TTF') }}/{{ item }}"
        mode: "0644"
      become: true
      loop:
        - Consolasligaturizedv3-Bold.ttf
        - Consolasligaturizedv3-BoldItalic.ttf
        - Consolasligaturizedv3-Italic.ttf
        - Consolasligaturizedv3.ttf

    - name: Download and extract FiraCode Nerd Font
      tags: fonts
      ansible.builtin.unarchive:
        src: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FiraCode.zip"
        dest: "{{ fonts_path | default('/usr/share/fonts/TTF') }}"
        remote_src: true
      become: true

- name: Configure general
  tags: [configure, general-config]
  ansible.builtin.import_playbook: general-config.yaml

- name: System update
  hosts: localhost
  tags: software-update-all
  tasks:
    - name: Apt update all packages
      ansible.builtin.apt:
        update_cache: true
        name: "*"
        state: latest
        only_upgrade: true
      become: true
