---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert apt-installed tools are on PATH # noqa: command-instead-of-shell
      ansible.builtin.shell: "command -v {{ item }}"
      changed_when: false
      loop:
        - docker
        - kubectl
        - eza
        - jq
        - rg
        - helm

    - name: Assert release binaries are installed
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      register: release_bin
      failed_when: not release_bin.stat.exists
      loop:
        - flux
        - kind
        - tflint
        - grype
        - agg
        - shfmt
