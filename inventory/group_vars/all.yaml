  - name: trivy
    uris: https://aquasecurity.github.io/trivy-repo/deb
    suites: generic
    components: main
    architectures: amd64
    signed_by: https://aquasecurity.github.io/trivy-repo/deb/public.key

  - name: gierens
    uris: http://deb.gierens.de
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://raw.githubusercontent.com/eza-community/eza/main/deb.asc

  - name: virtualbox
    uris: https://download.virtualbox.org/virtualbox/debian
    suites: noble
    components: contrib
    architectures: amd64
    signed_by: https://www.virtualbox.org/download/oracle_vbox_2016.asc

  - name: wezterm
    uris: https://apt.fury.io/wez/
    suites: "*"
    components: "*"
    signed_by: https://apt.fury.io/wez/gpg.key

  - name: task
    uris: https://dl.cloudsmith.io/public/task/task/deb/ubuntu
    suites: noble
    components: main
    signed_by: https://dl.cloudsmith.io/public/task/task/gpg.key

  - name: qsv
    uris: https://dathere.github.io/qsv-deb-releases
    suites: "./"
    signed_by: https://dathere.github.io/qsv-deb-releases/qsv-deb.gpg

  - name: githubcli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg

apt_install:
  - 1password
  - 1password-cli
  - asciinema
  - bat
  - code
  - containerd.io
  - direnv
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin
  - eza
  - ffmpeg
  - fzf
  - gh
  - gnome-shell-extension-manager
  - gnome-tweaks
  - google-chrome-stable
  - helm
  - imagemagick
  - jq
  - kamoso
  - kdeconnect
  - kubectl
  - kwin-bismuth
  - latte-dock
  - make
  - mpv
  - nmap
  - openssh-server
  - papirus-icon-theme
  - qsv
  - ripgrep
  - simplescreenrecorder
  - shellcheck
  - spotify-client
  - sshuttle
  - stow
  - tailscale
  - task
  - terraform
  - tree
  - trivy
  - vagrant
  - vault
  - vim
  - virtualbox-7.0
  - vlc
  - wezterm
  - zsh

snap_install:
  - asciinema-agg
  - dbeaver-ce
  - filelight
  - kdenlive
  - obsidian
  - slack
  - yq

snap_classic:
  - dbeaver-ce
  - obsidian

manala_ohmyzsh_dir: "{{ ansible_env.HOME }}/.oh-my-zsh"
manala_ohmyzsh:
  update: true

# custom plugins
zsh_plugins:
  - repo: https://github.com/Aloxaf/fzf-tab
    dest: "{{ manala_ohmyzsh_dir }}/custom/plugins/fzf-tab"
    version: v1.2.0

pyenv_version: HEAD
pyenv_virtualenv_version: HEAD
pyenv_update_version: HEAD
pyenv_update: true
pyenv_path: "{{ ansible_env.HOME }}/.pyenv"
pyenv_shellrc_file: ~/.zshrc
pyenv_python_versions:
  - 3.11.4
  - 3.12.10
  - 3.13.3
pyenv_global:
  - 3.13.3

nvm_version: 0.39.3
nvm_node_version: lts
nvm_install_path: "{{ ansible_env.HOME }}/.nvm"
nvm_install_deps: true

# storage.googleapis.com/golang is deprecated and now returns 403; use the
# canonical Google mirror instead.
golang_mirror: https://dl.google.com/go

git_username: "Campbell Whitworth"
git_email: "campbell.whitworth@fingermarkglobal.com"

k9s_version: v0.50.9

atuin_version: v18.8.0

# .deb packages installed directly from vendor URLs
session_manager_plugin_deb: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
keybase_deb: https://prerelease.keybase.io/keybase_amd64.deb
mongodb_compass_version: 1.48.2

# Single-binary tools pulled from GitHub releases into /usr/local/bin
release_binaries:
  - name: flux
    url: https://github.com/fluxcd/flux2/releases/download/v2.7.5/flux_2.7.5_linux_amd64.tar.gz
    archive: tar
    include: flux
  - name: kind
    url: https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
    archive: none
  - name: tflint
    url: https://github.com/terraform-linters/tflint/releases/download/v0.61.0/tflint_linux_amd64.zip
    archive: zip
    include: tflint
  - name: grype
    url: https://github.com/anchore/grype/releases/download/v0.114.0/grype_0.114.0_linux_amd64.tar.gz
    archive: tar
    include: grype
  - name: agg
    url: https://github.com/asciinema/agg/releases/download/v1.7.0/agg-x86_64-unknown-linux-gnu
    archive: none
  - name: shfmt
    url: https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
    archive: none

gifski_version: "1.34.0"
krew_version: v0.5.0
