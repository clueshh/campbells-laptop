---
# Third-party apt repositories in deb822 format. Each entry manages both the
# .sources file and its signing key (fetched from signed_by and stored, with the
# correct armored/binary extension, under /etc/apt/keyrings scoped via Signed-By).
apt_repositories:
  - name: google-chrome
    uris: http://dl.google.com/linux/chrome/deb/
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://dl.google.com/linux/linux_signing_key.pub

  - name: hashicorp
    uris: https://apt.releases.hashicorp.com
    suites: noble
    components: main
    architectures: amd64
    signed_by: https://apt.releases.hashicorp.com/gpg

  - name: spotify
    uris: https://repository.spotify.com
    suites: stable
    components: non-free
    architectures: amd64
    signed_by: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc

  - name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: noble
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg

  - name: kubernetes
    uris: https://pkgs.k8s.io/core:/stable:/v1.29/deb/
    suites: "/"
    architectures: amd64
    signed_by: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key

  - name: helm
    uris: https://packages.buildkite.com/helm-linux/helm-debian/any/
    suites: any
    components: main
    architectures: amd64
    signed_by: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey

  - name: 1password
    uris: https://downloads.1password.com/linux/debian/amd64
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://downloads.1password.com/linux/keys/1password.asc

  - name: vscode
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://packages.microsoft.com/keys/microsoft.asc

  - name: tailscale
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: noble
    components: main
    architectures: amd64
    signed_by: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg

  - name: papirus
    uris: http://ppa.launchpad.net/papirus/papirus/ubuntu
    suites: noble
    components: main
    architectures: amd64
